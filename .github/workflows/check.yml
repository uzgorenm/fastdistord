name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev cmake
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: rustc --edition 2021 --test vendor/songbird/src/driver/dave_policy.rs -o /tmp/fastdistord-dave-tests && /tmp/fastdistord-dave-tests
      - run: cargo build --locked --release
      - if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Package private macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Fastdistord.app dist/fastdistord-macos-arm64.zip
      - name: Package private Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/fastdistord-linux-x86_64.tar.gz -C target/release fastdistord -C "$GITHUB_WORKSPACE" README.md LICENSE
      - name: Save private build downloads
        uses: actions/upload-artifact@v4
        with:
          name: fastdistord-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
